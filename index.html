<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>X動画保存</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#111; --card:#1c1c1e; --text:#f2f2f2; --sub:#9a9a9a; --accent:#1d9bf0; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#000; color:var(--text); font-size:16px; }
  button, .btn { display:block; width:100%; margin-top:10px; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; text-align:center; text-decoration:none; }
  .btn.sub { background:#2c2c2e; }
  #status { color:var(--sub); font-size:14px; min-height:20px; white-space:pre-wrap; }
  #status.err { color:var(--err); }
  video { width:100%; border-radius:10px; margin-top:10px; background:#000; }
  .hint { color:var(--sub); font-size:13px; line-height:1.6; }
  #install { display:none; }
</style>
</head>
<body>
  <h1>X動画保存</h1>

  <div class="card">
    <input id="url" type="url" placeholder="ポストのURL（例: https://x.com/.../status/123...）" autocomplete="off">
    <button id="go">動画を保存</button>
    <p id="status"></p>
    <div id="result"></div>
  </div>

  <div class="card">
    <button id="install" class="btn sub">ホーム画面に追加</button>
    <p class="hint">
      使い方：XアプリでポストのURLを「共有」→「動画保存」を選ぶと、自動で保存が始まります。<br>
      共有メニューに出ない場合は、Chromeのメニュー →「ホーム画面に追加」（アプリをインストール）を先に行ってください。
    </p>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const resultEl = $('result');

function setStatus(msg, isErr = false) {
  statusEl.textContent = msg;
  statusEl.className = isErr ? 'err' : '';
}

// 共有されたテキストからポストIDを取り出す
function extractId(text) {
  const m = String(text || '').match(/(?:x|twitter|fxtwitter|vxtwitter|fixupx)\.com\/(?:[^\/\s]+\/)?(?:i\/web\/)?status(?:es)?\/(\d+)/i);
  return m ? m[1] : null;
}

// 動画URLを取得（fxtwitter → vxtwitter の順に試す）
async function getVideos(id) {
  try {
    const r = await fetch(`https://api.fxtwitter.com/status/${id}`);
    if (r.ok) {
      const j = await r.json();
      const media = j?.tweet?.media?.all || j?.tweet?.media?.videos || [];
      const vids = media.filter((m) => m.type === 'video' || m.type === 'gif').map((m) => m.url).filter(Boolean);
      if (vids.length) return vids;
    }
  } catch (e) { /* 次を試す */ }

  try {
    const r = await fetch(`https://api.vxtwitter.com/Twitter/status/${id}`);
    if (r.ok) {
      const j = await r.json();
      const vids = (j?.media_extended || []).filter((m) => m.type === 'video' || m.type === 'gif').map((m) => m.url).filter(Boolean);
      if (vids.length) return vids;
    }
  } catch (e) { /* 失敗 */ }

  return [];
}

// 端末にダウンロード（直接保存できない場合は動画を開くリンクを表示）
async function download(videoUrl, filename) {
  try {
    const r = await fetch(videoUrl);
    if (!r.ok) throw new Error('fetch failed');
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    return true;
  } catch (e) {
    return false;
  }
}

async function run(input) {
  resultEl.innerHTML = '';
  const id = extractId(input);
  if (!id) { setStatus('ポストのURLが見つかりませんでした。', true); return; }

  setStatus('動画を探しています…');
  const vids = await getVideos(id);
  if (!vids.length) {
    setStatus('動画が見つかりませんでした。\n（動画のないポスト、鍵アカウント、削除済みなど）', true);
    return;
  }

  setStatus(`${vids.length}本の動画を保存しています…`);
  let ok = 0;
  for (let i = 0; i < vids.length; i++) {
    const name = `x_${id}${vids.length > 1 ? '_' + (i + 1) : ''}.mp4`;
    if (await download(vids[i], name)) {
      ok++;
    } else {
      // 直接保存できなかった場合：手動保存用のボタンを表示
      const a = document.createElement('a');
      a.className = 'btn';
      a.href = vids[i];
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = `動画${vids.length > 1 ? i + 1 : ''}を開く（⋮ → ダウンロード）`;
      resultEl.appendChild(a);
    }
  }

  if (ok === vids.length) {
    setStatus(`保存しました（${ok}本）。「ダウンロード」フォルダを確認してください。`);
  } else if (ok > 0) {
    setStatus(`${ok}本保存しました。残りは下のボタンから保存してください。`);
  } else {
    setStatus('直接保存できませんでした。下のボタンで動画を開き、メニューから「ダウンロード」を選んでください。');
  }
}

$('go').addEventListener('click', () => run($('url').value));
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') run($('url').value); });

// 共有メニューから開かれた場合は自動で実行
const params = new URLSearchParams(location.search);
const shared = [params.get('url'), params.get('text'), params.get('title')].filter(Boolean).join(' ');
if (shared) {
  $('url').value = shared;
  history.replaceState(null, '', location.pathname);
  run(shared);
}

// ホーム画面への追加ボタン
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  $('install').style.display = 'block';
});
$('install').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $('install').style.display = 'none';
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
